<ion-content class="communicator-shell">
  <main class="communicator" aria-labelledby="current-phrase">
    <nav class="communicator__bar communicator__bar--top" aria-label="Navegación principal">
      <button
        class="control-button"
        type="button"
        aria-label="Volver al nivel anterior"
        (click)="goBack()"
      >
        Atrás
      </button>
      <h1 id="current-phrase" class="current-phrase" aria-live="polite">{{ currentPhrase }}</h1>
      <button
        class="control-button"
        type="button"
        aria-label="Volver al inicio"
        (click)="startOver()"
      >
        Inicio
      </button>
    </nav>

    <section class="communication-grid" aria-label="Opciones de comunicación">
      @for (option of communicationOptions; track option.id) {
        <button
          class="communication-option {{ option.colorClass }}"
          [class.communication-option--focused]="focusedOptionId === option.id"
          [class.communication-option--confirming]="
            confirmingOptionId === option.id ||
            (confirmationProgress > 0 && focusedOptionId === option.id)
          "
          [style.--confirmation-progress]="confirmationProgress + '%'"
          type="button"
          [attr.aria-label]="option.ariaLabel"
          [attr.aria-pressed]="focusedOptionId === option.id"
          [attr.aria-busy]="
            confirmingOptionId === option.id ||
            (confirmationProgress > 0 && focusedOptionId === option.id)
              ? 'true'
              : null
          "
          (pointerdown)="beginPress(option.id)"
          (pointerup)="endPress(option.id)"
          (pointerleave)="cancelPress()"
          (pointercancel)="cancelPress()"
          (keydown.enter)="beginPress(option.id, $event)"
          (keyup.enter)="endPress(option.id)"
          (keydown.space)="beginPress(option.id, $event)"
          (keyup.space)="endPress(option.id)"
          (contextmenu)="$event.preventDefault()"
        >
          <span class="communication-option__pictogram" aria-hidden="true">{{ option.emoji }}</span>
          <span class="communication-option__label">{{ option.label }}</span>
        </button>
      }
    </section>

    <nav class="communicator__bar communicator__bar--bottom" aria-label="Controles del comunicador">
      <button
        class="control-button"
        type="button"
        aria-label="Repetir la opción enfocada o la frase actual"
        (click)="repeatFocused()"
      >
        Repetir
      </button>
      <button
        class="control-button control-button--no-option"
        type="button"
        [disabled]="!hasMoreOptions && !canOpenNoOptionFallback"
        [attr.aria-describedby]="hasMoreOptions ? null : 'no-option-explanation'"
        [attr.aria-label]="noOptionAriaLabel"
        (click)="showNextOptions()"
      >
        {{ hasMoreOptions ? 'Otras opciones' : 'No encuentro mi opción' }}
      </button>
      <span id="no-option-explanation" class="communicator__assistive-text">
        No encuentro mi opción muestra cuatro alternativas locales de rescate sin conexión.
      </span>
      <button
        class="control-button"
        type="button"
        aria-label="Abrir configuración con pulsación mantenida"
      >
        Configuración
      </button>
    </nav>
  </main>
</ion-content>
